name: Bridge RT validate

on:
  pull_request:
    paths:
      - "bridge/**"
      - "data/*.txt"
      - "docker-compose.yml"
      - "compose.override.ci.yml"
      - ".github/workflows/bridge-rt-validate.yml"
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "data/*.txt"
      - "docker-compose.yml"
      - "compose.override.ci.yml"
      - ".github/workflows/bridge-rt-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: docker compose up bridge + MobilityData validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync tooling deps
        working-directory: tooling
        run: uv sync --frozen

      - name: Build gtfs.zip
        run: uv run --directory tooling python scripts/build_gtfs_zip.py

      - name: Start bridge in fixture mode
        run: |
          # Fixture mode — explicitly NO secrets.ORIGIN_AVL (per R-03).
          docker compose -f docker-compose.yml -f compose.override.ci.yml build bridge
          docker compose -f docker-compose.yml -f compose.override.ci.yml run -d --name bridge-smoke \
            --service-ports \
            -e ORIGIN_AVL=file:///app/fixture/avl-sample.xml \
            -v "$(pwd)/bridge/test/fixtures/avl-sample.xml:/app/fixture/avl-sample.xml:ro" \
            bridge

      - name: Wait for /healthz (status ok or degraded)
        run: |
          set -euo pipefail
          mkdir -p smoke-out
          for i in $(seq 1 30); do
            BODY=$(curl -fsS http://localhost:3001/healthz || true)
            echo "poll $i: $BODY"
            if echo "$BODY" | grep -Eq '"status"\s*:\s*"(ok|degraded)"'; then
              echo "$BODY" > smoke-out/healthz.json
              exit 0
            fi
            sleep 2
          done
          echo "bridge did not reach ok/degraded within 60 s" >&2
          docker compose -f docker-compose.yml -f compose.override.ci.yml logs bridge >&2 || true
          exit 1

      - name: Fetch .pb endpoints
        run: |
          set -euo pipefail
          mkdir -p smoke-out
          curl -fsS http://localhost:3001/gtfs-rt/vehicle-positions.pb -o smoke-out/vehicle-positions.pb
          curl -fsS http://localhost:3001/gtfs-rt/trip-updates.pb -o smoke-out/trip-updates.pb
          ls -la smoke-out/

      - name: Download MobilityData gtfs-realtime-validator
        run: |
          set -euo pipefail
          # Pin a known release. If the URL changes (404), bump this PR.
          VALIDATOR_URL="https://github.com/MobilityData/gtfs-realtime-validator/releases/download/v1.0.0/gtfs-realtime-validator-lib-1.0.0.jar"
          curl -fsSL "$VALIDATOR_URL" -o smoke-out/validator.jar
          ls -la smoke-out/validator.jar

      - name: Run validator (assert zero P0/P1)
        run: |
          set -euo pipefail
          # Run validator against the two .pb files plus gtfs.zip.
          # Output JSON to parse; assert zero ERROR-severity issues.
          java -jar smoke-out/validator.jar \
            -gtfs data/output/gtfs.zip \
            -gtfsRealtime smoke-out/vehicle-positions.pb \
            -gtfsRealtime smoke-out/trip-updates.pb \
            -output smoke-out/validator-report.json | tee smoke-out/validator.log
          # Heuristic: the JSON report has a `results` array with `errorCount` per rule.
          # Fail the build if any error-level count is > 0.
          ERR_COUNT=$(jq '[.. | objects | .errorCount? // 0] | add // 0' smoke-out/validator-report.json)
          echo "total errorCount=$ERR_COUNT"
          test "$ERR_COUNT" = "0"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-rt-validate-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f compose.override.ci.yml logs bridge > smoke-out/bridge.log || true
          docker rm -f bridge-smoke || true
          docker compose -f docker-compose.yml -f compose.override.ci.yml down || true
