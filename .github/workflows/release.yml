name: Release

# Triggered when a PR from a `release/X.Y.Z` branch is merged into `main`.
# The workflow extracts the version from the head ref, builds and validates
# the feed, and publishes a GitHub Release named `vX.Y.Z` with `gtfs.zip`
# attached (softprops/action-gh-release@v2 creates the tag itself).
#
# A `workflow_dispatch` escape hatch is provided for re-publishing a
# specific version manually (e.g. if a release needs to be re-cut without
# opening a new release/* PR).

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.1) — without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build + validate + publish GitHub Release
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.merged == true
        && startsWith(github.head_ref, 'release/'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute tag
        id: tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="${HEAD_REF#release/}"
          else
            VERSION="${DISPATCH_VERSION}"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "error: ${VERSION} is not a valid SemVer string" >&2
            exit 1
          fi
          echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps
        working-directory: tooling
        run: uv sync --frozen

      - name: Build gtfs.zip
        run: uv run --directory tooling python scripts/build_gtfs_zip.py

      - name: Validate with MobilityData Canonical
        uses: npaun/md-gtfs-validator-action@v2
        with:
          gtfs_path: data/output/gtfs.zip
          md_validator_version: "8.0.1"
          java_version: "21"
          node_version: "20"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          target_commitish: main
          generate_release_notes: true
          files: data/output/gtfs.zip
