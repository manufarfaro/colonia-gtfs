name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build + validate + publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps
        working-directory: tooling
        run: uv sync --frozen

      - name: Build gtfs.zip
        run: uv run --directory tooling python scripts/build_gtfs_zip.py

      - name: Validate with MobilityData Canonical
        uses: npaun/md-gtfs-validator-action@v2
        with:
          gtfs_path: data/output/gtfs.zip
          md_validator_version: "8.0.1"
          java_version: "21"
          node_version: "20"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: data/output/gtfs.zip
