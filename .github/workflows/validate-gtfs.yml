name: Validate GTFS

on:
  pull_request:
    paths:
      - "data/*.txt"
      - "tooling/scripts/build_gtfs_zip.py"
      - "tooling/pyproject.toml"
      - "tooling/uv.lock"
      - ".github/workflows/validate-gtfs.yml"
  push:
    branches: [main]
    paths:
      - "data/*.txt"
      - "tooling/scripts/build_gtfs_zip.py"
      - "tooling/pyproject.toml"
      - "tooling/uv.lock"
      - ".github/workflows/validate-gtfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: MobilityData Canonical Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps
        working-directory: tooling
        run: uv sync --frozen

      - name: Build gtfs.zip
        run: uv run --directory tooling python scripts/build_gtfs_zip.py

      - name: Validate with MobilityData Canonical
        uses: npaun/md-gtfs-validator-action@v2
        with:
          gtfs_path: data/output/gtfs.zip
          md_validator_version: "8.0.1"
          java_version: "21"
          node_version: "20"
