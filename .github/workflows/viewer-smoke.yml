name: Viewer Smoke

on:
  pull_request:
    paths:
      - "viewer/**"
      - "bridge/**"
      - "deployment/otp/**"
      - "data/*.txt"
      - "data/colonia.osm.pbf"
      - "docker-compose.yml"
      - "tooling/scripts/build_gtfs_zip.py"
      - "tooling/pyproject.toml"
      - "tooling/uv.lock"
      - ".github/workflows/viewer-smoke.yml"
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "bridge/**"
      - "deployment/otp/**"
      - "data/*.txt"
      - "data/colonia.osm.pbf"
      - "docker-compose.yml"
      - "tooling/scripts/build_gtfs_zip.py"
      - "tooling/pyproject.toml"
      - "tooling/uv.lock"
      - ".github/workflows/viewer-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: docker compose up viewer + end-to-end probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync tooling deps
        working-directory: tooling
        run: uv sync --frozen

      - name: Build gtfs.zip
        run: uv run --directory tooling python scripts/build_gtfs_zip.py

      - name: Rebase fixture timestamps to "now"
        run: |
          set -euo pipefail
          # Same rationale as bridge-rt-validate.yml — pin the fixture
          # markers near wall clock so RT entries are not stale.
          mkdir -p smoke-out
          STAMP=$(TZ=America/Montevideo date -d '5 minutes ago' '+%Y-%m-%d %H:%M:%S')
          echo "rebasing all marker.time → \"$STAMP\""
          LC_ALL=C sed -E "s/time=\"[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}\"/time=\"$STAMP\"/g" \
            bridge/test/fixtures/avl-sample.xml > smoke-out/avl-rebased.xml

      - name: Write smoke-specific compose override
        run: |
          # Reusing compose.override.ci.yml here is wrong: that file maps OTP
          # to host :8080, colliding with the viewer (which legitimately owns
          # :8080 in v0). For this smoke we only need the viewer published —
          # otp and bridge stay internal because the viewer is the one
          # talking to them. The override below just plumbs the fixture
          # ORIGIN_AVL into bridge without exposing additional ports.
          cat > compose.override.viewer-smoke.yml <<EOF
          services:
            bridge:
              environment:
                ORIGIN_AVL: file:///app/fixture/avl-sample.xml
              volumes:
                - $(pwd)/smoke-out/avl-rebased.xml:/app/fixture/avl-sample.xml:ro
          EOF
          cat compose.override.viewer-smoke.yml

      - name: Build stack (otp + bridge + viewer)
        run: |
          # Fixture mode — explicitly NO secrets.ORIGIN_AVL (per R-11).
          docker compose -f docker-compose.yml -f compose.override.viewer-smoke.yml build otp bridge viewer

      - name: Start stack
        run: |
          set -euo pipefail
          # depends_on with condition: service_healthy waits for otp + bridge
          # healthchecks before viewer comes up.
          docker compose -f docker-compose.yml -f compose.override.viewer-smoke.yml up -d viewer

      - name: Wait for viewer /api/healthz (ok or degraded)
        run: |
          set -euo pipefail
          mkdir -p smoke-out
          for i in $(seq 1 60); do
            BODY=$(curl -fsS http://localhost:8080/api/healthz || true)
            echo "poll $i: $BODY"
            if echo "$BODY" | grep -Eq '"status"\s*:\s*"(ok|degraded)"'; then
              echo "$BODY" > smoke-out/healthz.json
              break
            fi
            sleep 2
          done
          test -s smoke-out/healthz.json

      - name: Hit /api/plan (Buquebus → PdT, pinned weekday+time)
        run: |
          set -euo pipefail
          PAYLOAD='{"from":{"lat":-34.471,"lon":-57.852},"to":{"lat":-34.449,"lon":-57.815},"date":"2026-05-20","time":"14:00"}'
          echo "$PAYLOAD" > smoke-out/plan-request.json
          curl -fsS -o smoke-out/plan-response.json \
            -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" \
            http://localhost:8080/api/plan
          jq -e '.itineraries[0].legs[0]' smoke-out/plan-response.json > /dev/null

      - name: Hit /api/lines/4
        run: |
          set -euo pipefail
          curl -fsS -o smoke-out/line-4.json http://localhost:8080/api/lines/4
          jq -e '.line.shortName == "4"' smoke-out/line-4.json > /dev/null

      - name: Hit /api/lines/4/vehicles
        run: |
          set -euo pipefail
          curl -fsS -o smoke-out/line-4-vehicles.json http://localhost:8080/api/lines/4/vehicles
          jq -e '.lineId == "4"' smoke-out/line-4-vehicles.json > /dev/null

      - name: Fetch root page and assert disclaimer present
        run: |
          set -euo pipefail
          curl -fsS -o smoke-out/root.html http://localhost:8080/
          # The disclaimer copy from messages/es.json must appear in the HTML.
          # Match the unique fragment "tarifas a confirmar" (case-insensitive).
          grep -qi 'tarifas a confirmar' smoke-out/root.html

      - name: Collect logs
        if: always()
        run: |
          mkdir -p smoke-out
          docker compose -f docker-compose.yml -f compose.override.viewer-smoke.yml logs viewer > smoke-out/viewer.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.override.viewer-smoke.yml logs otp > smoke-out/otp.log 2>&1 || true
          docker compose -f docker-compose.yml -f compose.override.viewer-smoke.yml logs bridge > smoke-out/bridge.log 2>&1 || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f compose.override.viewer-smoke.yml down || true
