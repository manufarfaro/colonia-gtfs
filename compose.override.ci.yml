# Override usado por .github/workflows/otp-smoke.yml.
#
# Expone el puerto 8080 del container al runner de GitHub Actions para que
# el step de smoke test pueda pegarle vía localhost. La base
# `docker-compose.yml` mantiene el servicio cerrado al host por default
# (D-06); este override existe solo para CI.

services:
  otp:
    ports:
      - "8080:8080"
  bridge:
    # Solo el smoke workflow del bridge (bridge-rt-validate.yml) usa este
    # override, vía `docker compose -f docker-compose.yml -f compose.override.ci.yml up bridge`.
    # otp-smoke.yml NO bajea este archivo — ese workflow existe justamente
    # para probar que OTP tolera al bridge ausente.
    ports:
      - "3001:3001"
